name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux binaries are static (musl) so they run on any distribution.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: kubejail-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: kubejail-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: kubejail-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: kubejail-macos-x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/kubejail out/${{ matrix.asset }}
          cd out && shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          gh release create "$GITHUB_REF_NAME" out/* scripts/selftest.sh \
            --title "kubejail $GITHUB_REF_NAME" --generate-notes
