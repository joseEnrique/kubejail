[package]
name = "kubejail"
version = "0.1.0"
edition = "2024"
description = "A shell that can only reach the API server of one Kubernetes cluster"
license = "MIT"
repository = "https://github.com/joseEnrique/kubejail"
readme = "README.md"
keywords = ["kubernetes", "kubectl", "sandbox", "security", "bubblewrap"]
categories = ["command-line-utilities"]
exclude = ["/dist", "/.github"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
jiff = "0.2"
k8s-openapi = { version = "0.29", default-features = false, features = ["latest"] }
kube = { version = "5.1.0", default-features = false, features = ["config"] }
libc = "0.2.191"
secrecy = "0.10.3"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "process", "signal", "time", "macros"] }
url = "2.5.8"
